<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="build" content="__BUILD_SHA__" />
    <title>sched-prod · incidents</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board">
      <div data-testid="loader" class="loader" role="status" aria-live="polite">Loading incidents…</div>
      <p data-testid="empty" class="empty" hidden>No incidents tonight.</p>
      <p class="error" role="alert" hidden></p>
      <ul data-testid="incident-list" class="list" hidden></ul>
    </main>
    <aside data-testid="incident-panel" class="panel" aria-labelledby="panel-title" hidden>
      <header class="panel-head">
        <h2 id="panel-title" class="panel-id"></h2>
        <button type="button" class="panel-close" aria-label="Close panel">×</button>
      </header>
      <p class="panel-sev"></p>
      <dl class="panel-facts">
        <dt>service</dt><dd class="panel-service"></dd>
        <dt>region</dt><dd class="panel-region"></dd>
        <dt>opened</dt><dd><time class="panel-time"></time></dd>
      </dl>
      <p class="panel-summary"></p>
      <button type="button" data-testid="panel-ack" class="panel-ack"></button>
      <p class="panel-acked" hidden>✓ acked</p>
    </aside>
    <footer>sched-prod incident board · build <code data-testid="build-sha">__BUILD_SHA__</code></footer>
  </body>
</html>
